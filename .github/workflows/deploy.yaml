name: Deploy app

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing repository tag to deploy or redeploy
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}

      - name: Set deployment target
        env:
          APP_PATH: ${{ secrets.APP_PATH }}
        run: |
          case "${APP_PATH}" in
            /*) ;;
            *) echo "APP_PATH must be an absolute path" >&2; exit 1;;
          esac
          case "${APP_PATH}" in
            *$'\n'*|*$'\r'*) echo "APP_PATH must not contain newlines" >&2; exit 1;;
          esac
          printf 'DEPLOY_TARGET=%s/prod/kod-proteinfold\n' "${APP_PATH}" >> "${GITHUB_ENV}"
          printf 'DEPLOY_COMMIT=%s\n' "$(git rev-parse HEAD)" >> "${GITHUB_ENV}"

      - name: Start SSH agent
        uses: webfactory/ssh-agent@a6f90b1f127823b31d4d4a8d96047790581349bd # v0.9.1
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}

      - name: Install pinned host key
        env:
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          umask 077
          printf '%s\n' "${SSH_KNOWN_HOSTS}" > ~/.ssh/known_hosts

      - name: Deploy and verify Git revision
        env:
          SSH_HOST: ${{ secrets.HOST }}
          SSH_USER: ${{ secrets.USER }}
        run: |
          deploy_command=$(printf 'ood-proteinfold-deploy %q %q' "${DEPLOY_TARGET}" "refs/tags/${RELEASE_TAG}")
          actual_commit=$(ssh -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "${SSH_USER}@${SSH_HOST}" "${deploy_command}")
          if [[ "${actual_commit}" != "${DEPLOY_COMMIT}" ]]; then
            printf 'Deployment verification failed\nExpected: %s\nActual:   %s\n' \
              "${DEPLOY_COMMIT}" "${actual_commit}" >&2
            exit 1
          fi

      - name: Report deployment target
        run: |
          echo "Deployed ${RELEASE_TAG} to ${DEPLOY_TARGET}"
